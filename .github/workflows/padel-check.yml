name: Padelbaan-check De Geeren

on:
  schedule:
    # elke 10 minuten (niet op :00, dan is GitHub het drukst en vertraagt het meest)
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # om state.json en docs/slots.json terug te committen

concurrency:
  group: padel-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4

      - name: Check beschikbaarheid
        # Fouten (site even onbereikbaar) laten de run niet falen; het script
        # meldt zelf in Slack als het 3x op rij misgaat.
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 padel_check.py

      - name: State opslaan
        run: |
          if ! git diff --quiet -- state.json docs/slots.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json docs/slots.json
            git commit -m "state bijgewerkt"
            git push
          fi
